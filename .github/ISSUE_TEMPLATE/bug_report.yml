name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you expected instead }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Careerloom version and OS, placeholder: "0.3.0, macOS 15 arm64" }
    validations: { required: true }
  - type: input
    id: runner
    attributes: { label: Agent runner used, placeholder: "OpenCode / Claude Code / Codex / OpenRouter" }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, description: "Remove API keys and personal data first" }
