name: Release desktop

# Tag `vX.Y.Z` (matching package.json version) to build and attach installers.
# The in-app updater (electron/updates.ts) reads these tags.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          - os: windows-latest
            script: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests run on every PR (ubuntu CI); several assume POSIX file modes, so they are not repeated on Windows here.
      # Windows installers embed portable Node/Python/Git (package:win runs scripts/fetch-runtime.mjs).
      - uses: actions/cache@v4
        if: matrix.os == 'windows-latest'
        with:
          path: build/.runtime-cache
          key: runtime-${{ hashFiles('build/runtime-manifest.json') }}
      # electron-builder only builds; the release step below publishes (it would otherwise want GH_TOKEN on a tag).
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          # Unsigned builds; set CSC_LINK/CSC_KEY_PASSWORD (+ APPLE_ID for notarizing) to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Release text: docs/releases/<tag>.md — add one before tagging.
          draft: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
