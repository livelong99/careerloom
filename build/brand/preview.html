<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Careerloom brand preview</title>
<style>
:root{--ink:#10151d;--ivory:#f7f5f0;--mut:#6b7280}
body{margin:0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;background:#e9e7e1;color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:32px 0 12px}p{color:var(--mut);margin:0}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;padding:24px;border-radius:16px}
.light{background:var(--ivory)}.dark{background:var(--ink);color:var(--ivory)}
figure{margin:0;text-align:center;font-size:12px}figure img{display:block;margin:0 auto 6px;image-rendering:auto}
.big img{max-width:100%;height:auto}
.logo img{max-width:100%;height:auto;width:640px}
</style></head><body><main>
<h1>Careerloom brand preview</h1>
<p>Meet Loomi: a yarn ball with one loose amber thread.</p>
<h2>App icon on light and dark backgrounds</h2>
<div class="row light">
  <figure><img src="app-icon.svg" width="256" height="256" alt="Careerloom app icon at 256px">256</figure>
  <figure><img src="app-icon.svg" width="64" height="64" alt="">64</figure>
  <figure><img src="app-icon.svg" width="32" height="32" alt="">32</figure>
  <figure><img src="app-icon.svg" width="16" height="16" alt="">16</figure>
  <figure><img src="mark.svg" width="64" height="64" alt="">mark 64</figure>
  <figure><img src="mark.svg" width="16" height="16" alt="">mark 16</figure>
</div>
<div class="row dark" style="margin-top:16px">
  <figure><img src="app-icon.svg" width="256" height="256" alt="">256</figure>
  <figure><img src="app-icon.svg" width="64" height="64" alt="">64</figure>
  <figure><img src="app-icon.svg" width="32" height="32" alt="">32</figure>
  <figure><img src="app-icon.svg" width="16" height="16" alt="">16</figure>
  <figure><img src="mark.svg" width="64" height="64" alt="">mark 64</figure>
  <figure><img src="mark.svg" width="16" height="16" alt="">mark 16</figure>
</div>
<h2>Horizontal logo</h2>
<div class="row light logo"><img src="logo-horizontal.svg" alt="Careerloom logo for light backgrounds"></div>
<div class="row dark logo" style="margin-top:16px"><img src="logo-horizontal-dark.svg" alt="Careerloom logo for dark backgrounds"></div>
<h2>App icon at 1024px (Dock master)</h2>
<div class="row light big"><figure><img src="app-icon.svg" width="1024" height="1024" alt="">1024</figure></div>
</main></body></html>
